<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="90" viewBox="0 0 920 90" fill="none">
  <style>
    .sticker { fill: #FFFFFF; stroke: #526D91; stroke-width: 2; stroke-dasharray: 5 3; rx: 12px; }
    .badge-text { font-family: monospace; font-size: 15px; fill: #526D91; font-weight: bold; }
  </style>

  <!-- Row 1 -->
  <g transform="translate(0, 5)">
    <rect class="sticker" width="110" height="34" />
    <text x="16" y="22" class="badge-text">✧ NCBI</text>
  </g>

  <g transform="translate(120, 5)">
    <rect class="sticker" width="110" height="34" />
    <text x="16" y="22" class="badge-text">✧ BLAST</text>
  </g>

  <g transform="translate(240, 5)">
    <rect class="sticker" width="110" height="34" />
    <text x="16" y="22" class="badge-text">✧ MEGA</text>
  </g>

  <g transform="translate(360, 5)">
    <rect class="sticker" width="120" height="34" />
    <text x="16" y="22" class="badge-text">✧ NCBI GE0</text>
  </g>

    <g transform="translate(0, 48)">
    <rect class="sticker" width="110" height="34" />
    <text x="16" y="22" class="badge-text">✧ STRING</text>
  </g>
  
</svg>
