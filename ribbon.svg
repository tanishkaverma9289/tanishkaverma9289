
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="54" viewBox="0 0 1200 54">

  <defs>
    <clipPath id="ribbon">
      <rect width="1200" height="54" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1200" height="54" rx="14" fill="#F0F3FA"/>

  <g clip-path="url(#ribbon)">
    <g>
      <animateTransform
